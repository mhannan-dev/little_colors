[package]
name = "formula-circuit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "=0.18.1", default-features = false, features = [
    "std", "async_executor", "bevy_log", "bevy_winit",
    "bevy_pbr", "bevy_gizmos_render", "bevy_ui_render", "default_font",
] }
bevy_rapier3d = { version = "=0.33.0", default-features = false, features = ["dim3", "debug-render-3d"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["multi_threaded", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["webgl2"] }

[profile.dev]
debug = 0

[profile.wasm]
inherits = "release"
opt-level = 2
strip = "debuginfo"
