[package]
name = "formula-circuit"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.18.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit",
    "bevy_pbr", "bevy_gizmos_render", "bevy_ui_render", "default_font", "x11",
] }
bevy_rapier3d = { version = "=0.33.0", default-features = false, features = ["dim3", "debug-render-3d"] }

[profile.dev]
debug = 0
