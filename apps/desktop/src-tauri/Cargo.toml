[package]
name = "little-colors"
version = "0.1.0"
description = "Little Colors — offline educational game for young children"
authors = ["Little Colors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "little_colors_lib"
# Only rlib: cdylib is for Tauri mobile (unused; mobile is React Native) and breaks MinGW linking.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
